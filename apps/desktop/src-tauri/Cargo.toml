[package]
name = "nexus-desktop"
description = "NEXUS Controller Engine desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
nexus-controller-core.workspace = true
nexus-engine.workspace = true
nexus-profile-manager.workspace = true
nexus-telemetry.workspace = true
nexus-macro-engine.workspace = true
nexus-input-processing.workspace = true
nexus-virtual-controller.workspace = true
nexus-app-detect.workspace = true
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
nexus-updates.workspace = true
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target."cfg(windows)".dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Registry"] }
