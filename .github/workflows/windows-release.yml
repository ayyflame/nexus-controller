# Builds the NEXUS Windows x64 installers.
#
# Triggers:
#   - Manually (Actions tab → "Windows release build" → Run workflow): builds and
#     uploads the installers as a workflow artifact.
#   - Pushing a tag like v0.1.0: builds and publishes a GitHub pre-release
#     with the installers attached.
#   - Publishing a GitHub Release: builds and attaches the installers to it.
#
# The installers are unsigned until a code-signing certificate is configured.
# No drivers are bundled or installed.

name: Windows release build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write # needed only to attach installers to a release

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Type-check frontend
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build installers
        working-directory: apps/desktop
        run: npx tauri build

      - name: Collect installers
        id: collect
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force -Path installers
          Copy-Item target/release/bundle/nsis/*.exe $out
          Copy-Item target/release/bundle/msi/*.msi $out
          Get-ChildItem $out -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content (Join-Path $out "SHA256SUMS.txt")
          }
          Get-ChildItem $out | Format-Table Name, Length
          $exe = (Get-ChildItem $out -Filter *-setup.exe | Select-Object -First 1).Name
          "exe=$exe" >> $env:GITHUB_OUTPUT

      - name: Verify the app binary has no VC++ runtime dependency
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
          if (-not $dumpbin) { Write-Warning "dumpbin not found; skipping check"; exit 0 }
          $deps = & $dumpbin.FullName /dependents target/release/nexus-desktop.exe
          $deps
          if ($deps -match "VCRUNTIME|MSVCP") { throw "nexus-desktop.exe depends on the VC++ runtime DLLs" }

      - name: Upload installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-windows-x64
          path: installers/
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --prerelease --title "NEXUS $env:TAG (Windows x64)" --notes-file docs/release-notes.md
          }
          gh release upload $env:TAG (Get-ChildItem installers -File).FullName --clobber
